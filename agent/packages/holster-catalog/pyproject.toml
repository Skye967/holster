[project]
name = "holster-catalog"
version = "0.2.0"
description = "Holster's catalog core — the TMDB client and the agent over it"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.12.0",
    "langchain-core>=1.6.10",
    # 1.2.18 is the first whose async runs keep a node's handled error from re-raising.
    "langgraph>=1.2.18",
    "pydantic>=2",
]

# Its own group: `uv sync --package` installs this member's groups alone.
[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.mypy]
strict = true

# Run from here without this table, pytest walks up to the root's, whose pythonpath
# lets a library test import the service.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
