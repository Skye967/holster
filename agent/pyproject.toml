[project]
name = "holster-agent"
version = "0.1.0"
description = "Holster agent — LangChain orchestration and TMDB catalog tools"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # The TMDB client, and Starlette's TestClient. A runtime dep since the
    # container runs `uv sync --no-dev`.
    "httpx2>=2.12.0",
    "langchain-google-genai>=4.4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

# Run by uvicorn, not installed as a package — no wheel to build.
[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's Depends(...) as a parameter default is the framework's own
# idiom, not the mutable-default footgun B008 exists to catch.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["."]
