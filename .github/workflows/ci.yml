name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A task id says where a decision was recorded, not why the code is the way
      # it is, and means nothing without the planning docs open (CLAUDE.md's
      # Comments section).
      #
      # Whole files rather than comment lines: `T` followed by digits matches no
      # identifier here, so the wider net costs nothing and reaches docstrings
      # and block comments.
      #
      # supabase/migrations is skipped: an applied migration is not edited
      # (db/README.md), so its comments stay as the record of that one change.
      # --exclude-dir matches a basename, and that is the only `migrations`
      # directory in the tree.
      - name: No task ids in comments
        run: |
          set +e
          grep -rnE '\bT[0-9]+(\.[0-9]+)?\b' . \
            --include='*.go' --include='*.py' --include='*.ts' --include='*.tsx' \
            --include='*.md' --include='*.sql' --include='*.yml' --include='*.mjs' \
            --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.git \
            --exclude-dir=migrations --exclude=hits.txt > hits.txt
          status=$?
          set -e
          # grep exits 1 for "no matches" (the good case); anything above
          # that is a real failure, such as a path that no longer exists or a
          # signal kill. Only 0 and 1 may pass: `|| true` would turn a renamed
          # directory into a permanent green.
          if [ "$status" -ge 2 ]; then
            echo "::error::grep failed - check the paths in this step" >&2
            exit 1
          fi
          if [ -s hits.txt ]; then
            echo "Task ids found - state the fact instead."
            echo "See CLAUDE.md > Code style > Comments."
            cat hits.txt
            exit 1
          fi

  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: holster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d holster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/holster
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      # gofmt does not fail on unformatted files, it lists them on stdout, so
      # this tests the listing. A file it cannot parse does fail it, exiting 2
      # before the test — that case reports the parse error and no listing.
      - name: gofmt
        working-directory: gateway
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files - run gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      # go test runs a high-confidence subset of vet; this runs its default set.
      - name: go vet
        working-directory: gateway
        run: go vet ./...

      # Service containers start before checkout, so the docker-compose.yml
      # bind-mount trick (supabase/migrations -> docker-entrypoint-initdb.d)
      # can't run here. Replay the migrations by hand instead.
      - name: Apply migrations
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No migration files found in supabase/migrations/" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: go test
        working-directory: gateway
        run: go test ./...

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    env:
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@v7
      # Bump together with the catalog job, .github/workflows/release-catalog.yml,
      # agent/Dockerfile's uv image, agent/README.md and uv_build in
      # holster-catalog's pyproject.toml.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.13.7
      - name: uv lock --check
        run: uv lock --check
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy main.py chat.py tests packages/holster-catalog/evals/run.py
      - name: pytest
        run: uv run pytest
      # Here rather than in the catalog job: run.py imports langchain's
      # init_chat_model, which only the service installs. Validates the cases,
      # calls nothing.
      - name: eval cases
        run: uv run python packages/holster-catalog/evals/run.py --check
      # Last, because a newly published advisory turns it red on a PR that changed
      # nothing here, and it should not hide the other steps' results when it does.
      # pip-audit rather than `uv audit`, which is still experimental. The root
      # export pins the library's dependencies too. --disable-pip audits the export
      # as written instead of re-resolving it, which pip-audit allows only for a
      # hashed file; --no-emit-workspace drops holster-catalog, the one line uv
      # writes as an unhashed editable path. `shell: bash` adds pipefail, so a
      # failed export fails the step itself.
      # Bump pip-audit together with agent/README.md's Tests block.
      - name: pip-audit
        shell: bash
        run: uv export --no-dev --format requirements-txt --no-emit-workspace | uvx pip-audit@2.10.1 -r /dev/stdin --strict --disable-pip

  # The library alone: fastapi, uvicorn and the Google provider are not installed,
  # so a stray import of one fails here.
  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/packages/holster-catalog
    env:
      UV_LOCKED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.13.7
      - name: uv sync
        run: uv sync --package holster-catalog
      - name: ruff check
        run: uv run --package holster-catalog ruff check .
      - name: ruff format
        run: uv run --package holster-catalog ruff format --check .
      - name: mypy
        run: uv run --package holster-catalog mypy src tests
      - name: pytest
        run: uv run --package holster-catalog pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Not bun-version-file: web/package.json's declared 1.3.13 crashes `next
      # build` under Turbopack (SIGILL, "this is a bug in Bun") on Linux —
      # reproduced here on both arm64 and x64, not just the arm64 web/Dockerfile
      # documents. 1.4.2 matches web/Dockerfile's ARG BUN_VERSION, which already
      # proved it safe — bump both together if this ever changes.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
