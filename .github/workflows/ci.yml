name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A task id says where a decision was recorded, not why the code is the way
      # it is, and means nothing without the planning docs open (CLAUDE.md's
      # Comments section).
      #
      # Whole files rather than comment lines: `T` followed by digits matches no
      # identifier here, so the wider net costs nothing and reaches docstrings
      # and block comments.
      #
      # supabase/migrations is skipped: an applied migration is not edited
      # (db/README.md), so its comments stay as the record of that one change.
      # --exclude-dir matches a basename, and that is the only `migrations`
      # directory in the tree.
      - name: No task ids in comments
        run: |
          set +e
          grep -rnE '\bT[0-9]+(\.[0-9]+)?\b' . \
            --include='*.go' --include='*.py' --include='*.ts' --include='*.tsx' \
            --include='*.md' --include='*.sql' --include='*.yml' --include='*.mjs' \
            --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.git \
            --exclude-dir=migrations --exclude=hits.txt > hits.txt
          status=$?
          set -e
          # grep exits 1 for "no matches" (the good case); anything above
          # that is a real failure, such as a path that no longer exists or a
          # signal kill. Only 0 and 1 may pass: `|| true` would turn a renamed
          # directory into a permanent green.
          if [ "$status" -ge 2 ]; then
            echo "::error::grep failed - check the paths in this step" >&2
            exit 1
          fi
          if [ -s hits.txt ]; then
            echo "Task ids found - state the fact instead."
            echo "See CLAUDE.md > Code style > Comments."
            cat hits.txt
            exit 1
          fi

  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: holster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d holster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/holster
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/gateway/go.mod
          cache-dependency-path: services/gateway/go.sum

      # Service containers start before checkout, so the docker-compose.yml
      # bind-mount trick (supabase/migrations -> docker-entrypoint-initdb.d)
      # can't run here. Replay the migrations by hand instead.
      - name: Apply migrations
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No migration files found in supabase/migrations/" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: go test
        working-directory: services/gateway
        run: go test ./...

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: pytest
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Not bun-version-file: web/package.json's declared 1.3.13 crashes `next
      # build` under Turbopack (SIGILL, "this is a bug in Bun") on Linux —
      # reproduced here on both arm64 and x64, not just the arm64 web/Dockerfile
      # documents. 1.4.2 matches web/Dockerfile's ARG BUN_VERSION, which already
      # proved it safe — bump both together if this ever changes.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
