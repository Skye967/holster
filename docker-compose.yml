# Local development topology.
#
# Services are commented out until they exist — uncomment each one as it lands so
# that `docker compose up` always works on a fresh clone rather than failing on a
# missing build context. Services that need secrets also need their `.env`
# entries filled in; they refuse to start without them, by design.

services:
  # --- Frontend -------------------------------------------------------------
  # web:
  #   build: ./web
  #   ports: ["3000:3000"]
  #   environment:
  #     NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
  #     CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
  #     NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL}
  #   depends_on: [gateway]

  # --- API gateway: the only exposed service, and the only writer -----------
  gateway:
    build: ./services/gateway
    ports: ["${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"]
    environment:
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
      # Defaults to the compose-network Postgres, as gateway_app — the
      # least-privilege role RLS applies to (T10). `localhost` in DATABASE_URL
      # means the gateway's own container, not the database — set the host to
      # `postgres`, or leave it unset to take this default.
      DATABASE_URL: ${DATABASE_URL:-postgresql://gateway_app:password@postgres:5432/holster}
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Container-network address — see agent's own block below. Not published
      # on the host: the gateway is the only thing that ever calls it.
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent:8000}
    depends_on:
      # db-init, not postgres: gateway_app is created NOLOGIN by the migration and
      # only gets a local login once db-init runs. Starting sooner just fails fast.
      db-init:
        condition: service_completed_successfully
      agent:
        condition: service_healthy

  # --- Agent: LangChain orchestration, read-only, not exposed ---------------
  # No published port: reachable from other compose services, never from the host
  # or the internet. The read-only database URL and verdict/conversation reads
  # arrive with the tasks that use them.
  agent:
    build: ./agent
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # App-level keys — opens nobody's account. Passed through plainly; the
      # service fails fast on startup if either is missing (see agent/main.py's
      # lifespan), the same way the gateway checks its own required env.
      TMDB_API_KEY: ${TMDB_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      # Optional; falls back to the agent's own default when unset. Left
      # without a compose-level default so that fallback stays defined in
      # one place (agent/catalog_tool.py's DEFAULT_MODEL), not duplicated
      # here — see agent/main.py's lifespan for how an empty value resolves.
      GOOGLE_MODEL: ${GOOGLE_MODEL}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # --- One-shot: give the T10 roles a local login --------------------------
  # gateway_app and agent_ro are created NOLOGIN by the migration (a committed
  # migration carries no password). This grants them the throwaway compose
  # password once Postgres is up; Supabase sets these in the dashboard instead.
  # Idempotent — ALTER ROLE is safe to re-run on every `up`.
  db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: password
    volumes:
      - ./db/local-roles.sql:/local-roles.sql:ro
    entrypoint:
      - psql
      - --host=postgres
      - --username=postgres
      - --dbname=holster
      - --set=ON_ERROR_STOP=1
      - --file=/local-roles.sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- Local Postgres -------------------------------------------------------
  # Supabase hosts the real database; this is a local stand-in so the stack runs
  # offline. Point DATABASE_URL at Supabase to use the hosted one instead.
  #
  # Migrations are mounted from supabase/migrations — the path the Supabase CLI
  # discovers, and so the only place they live. Postgres runs them once, when the
  # data directory is empty: after that the volume persists and new files are
  # ignored. `docker compose down -v` to re-init.
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: holster
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h forces a TCP check. Without it pg_isready answers on the unix socket
      # that the entrypoint's init-time server serves with listen_addresses='',
      # so the probe passes before the real server accepts connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d holster"]
      interval: 5s
      timeout: 5s
      retries: 5
      # First-run initdb plus migrations can outlast interval × retries. Failures
      # in this window do not count against retries; the first success ends it.
      start_period: 60s

volumes:
  postgres_data:
