  # --- Agent: LangChain orchestration ---------------------------------------
  # agent:
  #   build: ./agent
  #   ports: ["8000:8000"]
  #   environment:
  #     ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  #     CREDENTIALS_SERVICE_URL: ${CREDENTIALS_SERVICE_URL}
  #     DATABASE_URL: ${DATABASE_URL}

  # --- Local Postgres -------------------------------------------------------
  # Supabase hosts the real database; this is a local stand-in so the stack runs
  # offline. Point DATABASE_URL at Supabase to use the hosted one instead.
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: holster
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d holster"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
